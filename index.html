    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "NewsMediaOrganization",
            "@id": "https://newspulse24.com/#organization",
            "name": "NewsPulse 24",
            "legalName": "NewsPulse 24 Media Group",
            "url": "https://newspulse24.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://newspulse24.com/logo-512.png",
              "width": 512,
              "height": 512
            },
            "image": "https://newspulse24.com/og-image.jpg",
            "slogan": "Real News. Global Impact.",

            "@type": "WebSite",
            "@id": "https://newspulse24.com/#website",

            "name": "NewsPulse 24",
            "inLanguage": "en",
            "publisher": { "@id": "https://newspulse24.com/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://newspulse24.com/search?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
